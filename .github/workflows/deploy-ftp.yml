name: Deploy via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-ftp-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Testen, bouwen en uploaden
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Node installeren
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Afhankelijkheden installeren (exact volgens lockfile)
        run: npm ci

      - name: Beveiligingscontrole (npm audit)
        run: npm audit --audit-level=high

      - name: Typecontrole
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Bouwen
        run: npx vite build

      - name: FTP-client installeren
        run: sudo apt-get update && sudo apt-get install --yes lftp

      - name: App uploaden
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -f dist/index.html ]]; then
            printf 'Fout: de build heeft geen dist/index.html opgeleverd.\n' >&2
            exit 1
          fi

          for variable in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_SERVER_DIR; do
            value=${!variable:-}
            # Regeleinden weghalen die bij het kopiëren vóór of na de secret zijn beland.
            while [[ "$value" == $'\n'* || "$value" == $'\r'* ]]; do value=${value:1}; done
            while [[ "$value" == *$'\n' || "$value" == *$'\r' ]]; do value=${value::-1}; done
            if [[ -z "$value" ]]; then
              printf 'Fout: de secret %s is niet ingesteld.\n' "$variable" >&2
              exit 1
            fi
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
              printf 'Fout: de secret %s bevat een regeleinde midden in de waarde.\n' "$variable" >&2
              exit 1
            fi
            printf -v "$variable" '%s' "$value"
          done

          esc() { local v=${1//\\/\\\\}; printf '%s' "${v//\"/\\\"}"; }

          printf 'Deploy naar %s gestart...\n' "$FTP_SERVER_DIR"
          # --delete: oude bestanden (ook van de vorige app) worden op de server opgeruimd.
          lftp <<EOF_LFTP
          set cmd:fail-exit true
          set net:max-retries 2
          set net:timeout 20
          set ftp:passive-mode true
          set ftp:ssl-allow true
          set ssl:verify-certificate true
          open "$(esc "$FTP_SERVER")"
          user "$(esc "$FTP_USERNAME")" "$(esc "$FTP_PASSWORD")"
          mirror --reverse --delete --verbose --parallel=4 dist/ "$(esc "$FTP_SERVER_DIR")"
          bye
          EOF_LFTP
          printf 'Deploy succesvol afgerond.\n'
